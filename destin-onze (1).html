function genererBiographie(p){
  const j = p.journal || [];
  const premierClub = (p.carriereClubs && p.carriereClubs.length) ? p.carriereClubs[0].nom : p.club.nom;
  const premiere = j[0];
  const meilleure = j.length ? j.reduce((a,b)=> (b.buts+parseFloat(b.noteMoy)) > (a.buts+parseFloat(a.noteMoy)) ? b : a) : null;
  const derniere = j[j.length-1];
  const paras = [];

  paras.push(`L'histoire de ${p.prenom} ${p.nom} commence à ${premierClub}, où ${drapeauDe(p.nationalite)} ${p.prenom} fait ses grands débuts professionnels à seulement 16 ans.${premiere?` Dès cette première saison, la presse locale titre : « ${premiere.headline} ».`:''} Un talent brut, encore à polir, mais une envie farouche de réussir.`);

  if(meilleure){
    paras.push(`La saison ${meilleure.saison}, à ${meilleure.age} ans, restera comme un tournant dans cette carrière : ${meilleure.buts} but${meilleure.buts>1?'s':''} inscrit${meilleure.buts>1?'s':''} sous les couleurs de ${meilleure.club}, salués par une Une devenue célèbre : « ${meilleure.headline} ».`);
  }
  let ligneTitres = [];
  if(p.stats.titres>0) ligneTitres.push(`${p.stats.titres} titre${p.stats.titres>1?'s':''} national${p.stats.titres>1?'aux':''}`);
  if((p.stats.coupesNationales||0)>0) ligneTitres.push(`${p.stats.coupesNationales} coupe${p.stats.coupesNationales>1?'s':''} nationale${p.stats.coupesNationales>1?'s':''}`);
  if(p.stats.coupesContinentales>0) ligneTitres.push(`${p.stats.coupesContinentales} sacre${p.stats.coupesContinentales>1?'s':''} continental${p.stats.coupesContinentales>1?'aux':''}`);
  if(p.stats.coupesDuMonde>0) ligneTitres.push(`${p.stats.coupesDuMonde} Coupe${p.stats.coupesDuMonde>1?'s':''} du Monde`);
  if(p.stats.ballonsOr>0) ligneTitres.push(`${p.stats.ballonsOr} Ballon${p.stats.ballonsOr>1?'s':''} d'Or`);
  if(ligneTitres.length){
    paras.push(`Les honneurs collectifs et individuels s'accumulent au fil des saisons : ${ligneTitres.join(', ')}. Le nom de ${p.prenom} ${p.nom} s'inscrit durablement dans l'histoire du football.`);
  } else {
    paras.push(`Sans jamais soulever de trophée majeur, ${p.prenom} bâtit une carrière solide, faite de régularité et de professionnalisme, appréciée par ses pairs comme par les observateurs les plus exigeants.`);
  }

  if(G.rival){
    paras.push(`Sur le terrain, un nom revient sans cesse : celui de ${G.rival.prenom} ${G.rival.nom}, devenu bien plus qu'un adversaire au fil des saisons. ${G.rival.relation>=15?`Une relation de respect mutuel, forgée dans la confrontation, aura marqué les esprits.`:G.rival.relation<=-15?`Une rivalité féroce, presque une inimitié, aura nourri chacune de leurs confrontations.`:`Une rivalité classique, sans excès, mais toujours intense.`}`);
  }

  if(p._fut_marie || p.enfants.length){
    paras.push(`${p._fut_marie?`Sur le plan personnel, ${p.prenom} trouve aussi son bonheur aux côtés de ${p.partenaire?p.partenaire.prenom:'son/sa partenaire'}.`:''} ${p.enfants.length?`${p.enfants.length} enfant${p.enfants.length>1?'s':''} (${p.enfants.map(e=>e.prenom).join(', ')}) vien${p.enfants.length>1?'nent':'t'} combler cette existence déjà bien remplie.`:''}`);
  } else {
    paras.push(`Discret sur sa vie privée, ${p.prenom} aura toujours gardé cette part de son existence loin des projecteurs.`);
  }

  if(p._fondation) paras.push(`Son engagement solidaire, à travers la Fondation ${p.prenom} ${p.nom}, aura permis d'aider des milliers de personnes bien au-delà des terrains.`);
  if(p._business && !p._business.faillite) paras.push(`En parallèle du sport, ${p._business.nom} se sera imposée comme une réussite entrepreneuriale à part entière.`);

  paras.push(`${derniere?`La dernière saison, à ${derniere.age} ans, s'achève sur ces mots : « ${derniere.headline} ».`:''} Après ${p.saison-1} saisons professionnelles et ${p.stats.matchs} matchs disputés, ${p.prenom} ${p.nom} raccroche les crampons avec une note de carrière de ${p._noteFinale}/100${p._reconversionType && p._reconversionType!=='tranquille' ? `, prêt(e) à entamer une nouvelle vie en tant que ${(RECONVERSIONS.find(r=>r.id===p._reconversionType)||{nom:''}).nom.toLowerCase()}.` : ', pour profiter enfin pleinement des siens.'}`);

  return paras.filter(Boolean);
}
function renderBiographie(){
  const p = G.player;
  const paras = genererBiographie(p);
  return `<main>
    <div class="clipping">
      <div class="clip-masthead">
        <div class="name display">${p.prenom.toUpperCase()} ${p.nom.toUpperCase()}</div>
        <div class="date">Le roman d'une carrière</div>
      </div>
      <div class="clip-columns">
        ${paras.map(par=>`<p style="margin:0 0 12px;">${par}</p>`).join('')}
      </div>
    </div>
    <div class="btn-stack">
      <button class="btn btn-primary" onclick="G.screen='retraite';render()">← Retour</button>
    </div>
  </main>`;
}

/* ------------------------------ SALLE DES TROPHÉES ------------------------------ */
const TROPHEES_DEFINITIONS = [
  {icon:'🥇', nom:"Ballon d'Or", getCount:p=>p.stats.ballonsOr},
  {icon:'🌍', nom:'Coupe du Monde', getCount:p=>p.stats.coupesDuMonde},
  {icon:'🏆', nom:'Coupe continentale', getCount:p=>p.stats.coupesContinentales},
  {icon:'🏆', nom:'Titre national', getCount:p=>p.stats.titres},
  {icon:'🏆', nom:'Coupe nationale', getCount:p=>p.stats.coupesNationales||0},
  {icon:'🌍', nom:'The Best FIFA', getCount:p=>p.stats.theBest||0},
  {icon:'⭐', nom:'Onze mondial FIFPro', getCount:p=>p.stats.mondeXI||0},
  {icon:'🌟', nom:'Trophée Kopa', getCount:p=>p._trophyKopa?1:0},
  {icon:'🧤', nom:'Trophée Yachine', getCount:p=>p._trophyYachine?1:0},
  {icon:'👟', nom:"Soulier d'Or", getCount:p=>p._soulierOr?1:0},
];
function renderSalleTrophees(){
  const p = G.player;
  const trophees = TROPHEES_DEFINITIONS.map(t=>({...t, count:t.getCount(p)})).filter(t=>t.count>0);
  return `<main>
    <h1 class="page-title">Salle des trophées</h1>
    <p class="lede">La vitrine de ${p.prenom} ${p.nom}, saison après saison.</p>
    ${trophees.length===0 ? `<div class="center-note">La vitrine est encore vide, mais chaque légende commence quelque part.</div>` : `
    <div class="photo-grid">
      ${trophees.map(t=>`<div class="photo-tile"><div class="pt-face" style="background:linear-gradient(135deg,rgba(240,180,41,0.35),rgba(240,180,41,0.1));font-size:30px;">${t.icon}</div><div class="pt-name">${t.nom}</div><div class="pt-sub">×${t.count}</div></div>`).join('')}
    </div>`}
    <div class="btn-stack">
      <button class="btn btn-primary" onclick="G.screen='retraite';render()">← Retour</button>
    </div>
  </main>`;
}

/* ------------------------------ ÉPILOGUE : 10 ANS APRÈS ------------------------------ */
function genererEpilogue(p){
  const paras = [];
  const legende = p._noteFinale>=85 || p.stats.ballonsOr>=1;
  if(legende){
    paras.push(`Dix ans après sa retraite, une statue de ${p.prenom} ${p.nom} trône fièrement devant le stade de ${p.club.nom}, immortalisant à jamais son geste le plus célèbre.`);
  } else if(p.stats.titres>0 || (p._retraite && p.carriereClubs.length<=1)){
    paras.push(`Dix ans après, ${p.club.nom} a retiré son numéro emblématique, jamais réattribué depuis. Une tribune du stade porte même son nom.`);
  } else {
    paras.push(`Dix ans après sa retraite, ${p.prenom} ${p.nom} reste une figure respectée dans le monde du football, souvent invité(e) lors des grandes occasions du club.`);
  }

  if(p._reconversionType==='entraineur') paras.push(`Sa reconversion sur le banc de touche aura porté ses fruits, avec plusieurs saisons marquantes à la tête de différents clubs.`);
  else if(p._reconversionType==='consultant') paras.push(`Sa voix reste aujourd'hui l'une des plus écoutées sur les plateaux télé les soirs de grands matchs.`);
  else if(p._reconversionType==='dirigeant') paras.push(`Passé de l'autre côté du miroir, ${p.prenom} a participé à façonner l'avenir de son club depuis les bureaux de la direction.`);
  else paras.push(`Loin des projecteurs, ${p.prenom} coule des jours heureux, savourant une retraite méritée après tant d'années au sommet.`);

  if(p._fondation) paras.push(`La Fondation ${p.prenom} ${p.nom} a continué de grandir, ayant désormais aidé plus de ${((p._fondation.beneficiaires||0)+randi(2000,8000)).toLocaleString('fr-FR')} personnes à travers le monde.`);
  if(p._business && !p._business.faillite) paras.push(`${p._business.nom} s'est imposée comme une référence dans son secteur, dix ans après ses débuts modestes.`);

  if(p.enfants.length){
    const enfant = p.enfants[0];
    const devenir = pick([
      `${enfant.prenom} a suivi les traces de ${p.prenom}, et fait aujourd'hui ses propres débuts professionnels sur les terrains.`,
      `${enfant.prenom} a choisi une toute autre voie, loin du football, et s'épanouit pleinement dans sa propre carrière.`,
      `${enfant.prenom} travaille aujourd'hui aux côtés de ${p.prenom}, notamment sur les projets de la fondation familiale.`,
      `${enfant.prenom} poursuit ses études avec brio, porté(e) par les valeurs transmises à la maison.`,
    ]);
    paras.push(devenir);
  }

  if(G.rival){
    paras.push(`Quant à ${G.rival.prenom} ${G.rival.nom}, ${G.rival.relation>=15?`les retrouvailles restent chaleureuses lors des événements du football mondial, deux légendes qui se respectent enfin pleinement.`:G.rival.relation<=-15?`la rivalité, même éteinte depuis longtemps sur le terrain, laisse encore planer une certaine froideur entre les deux anciens adversaires.`:`une relation cordiale s'est installée avec le temps, loin de l'intensité de leurs duels d'antan.`}`);
  }

  return paras;
}
function renderEpilogue(){
  const p = G.player;
  const paras = genererEpilogue(p);
  return `<main>
    <h1 class="page-title">10 ans après</h1>
    <p class="lede">Ce que devient la légende de ${p.prenom} ${p.nom}...</p>
    <div class="clipping">
      <div class="clip-masthead">
        <div class="name display">L'ÉCHO DU BALLON</div>
        <div class="date">Grand format — dix ans plus tard</div>
      </div>
      <div class="clip-columns">
        ${paras.map(par=>`<p style="margin:0 0 12px;">${par}</p>`).join('')}
      </div>
    </div>
    <div class="btn-stack">
      <button class="btn btn-primary" onclick="G.screen='retraite';render()">← Retour</button>
    </div>
  </main>`;
}

/* ------------------------------ BOUTIQUE ------------------------------ */
function renderShop(){
  return `<main>
    <h1 class="page-title">Boutique</h1>
    <p class="lede">Dépense tes jetons gagnés en carrière pour débloquer des avantages, équipables (2 max) au lancement d'une prochaine carrière.</p>
    <div class="jetons-pill" style="display:inline-block;margin-bottom:14px;">🪙 ${BANK.jetons} jetons</div>
    ${AVANTAGES.map(a=>{
      const owned = BANK.avantagesAchetes.includes(a.id);
      return `<div class="shop-item">
        <div class="shop-item-top">
          <div>
            <div class="si-name">${a.nom}</div>
            <div class="si-desc">${a.desc}</div>
          </div>
          <div class="si-cost">${a.cout}🪙</div>
        </div>
        ${owned ? `<button class="si-btn si-owned" disabled>Débloqué ✔</button>` : `<button class="si-btn si-buy" ${BANK.jetons<a.cout?'disabled':''} onclick="acheterAvantage('${a.id}')">Débloquer</button>`}
      </div>`;
    }).join('')}
    <div class="btn-stack">
      <button class="btn btn-ghost" onclick="G=null;render()">← Accueil</button>
    </div>
  </main>`;
}
function acheterAvantage(id){
  const a = AVANTAGES.find(x=>x.id===id);
  if(BANK.jetons<a.cout) return;
  BANK.jetons -= a.cout;
  BANK.avantagesAchetes.push(id);
  saveBank();
  render();
}

/* ------------------------------ BADGES ------------------------------ */
function renderBadges(){
  return `<main>
    <h1 class="page-title">Badges</h1>
    <p class="lede">${BANK.badgesGlobal.length} / ${BADGES.length} badges débloqués, toutes carrières confondues.</p>
    <div class="grid2">
      ${BADGES.map(b=>{
        const unlocked = BANK.badgesGlobal.includes(b.id);
        return `<div class="badge-tile ${unlocked?'':'locked'}">
          <div class="b-icon">${unlocked?b.icon:'❔'}</div>
          <div class="b-name">${unlocked?b.nom:'???'}</div>
          <div class="b-desc">${unlocked?b.desc:'Badge verrouillé'}</div>
        </div>`;
      }).join('')}
    </div>
    <div class="btn-stack" style="margin-top:16px;">
      <button class="btn btn-ghost" onclick="G=null;render()">← Accueil</button>
    </div>
  </main>`;
}

/* ------------------------------ HALL OF FAME ------------------------------ */
function renderHOF(){
  return `<main>
    <h1 class="page-title">Panthéon</h1>
    <p class="lede">Les plus grandes légendes écrites jusqu'ici.</p>
    ${HOF.length===0 ? `<div class="center-note">Aucune légende enregistrée. Termine une carrière pour entrer au Panthéon.</div>` :
      HOF.map((h,i)=>`<div class="shop-item">
        <div class="shop-item-top">
          <div>
            <div class="si-name">#${i+1} — ${h.nationalite?drapeauDe(h.nationalite)+' ':''}${h.nom}</div>
            <div class="si-desc">${POSTES.find(p=>p.id===h.poste)?.nom||h.poste} · ${h.club} · ${h.saisons} saisons<br>${h.buts} buts · ${h.titres} titre(s) · ${h.ballonsOr} Ballon(s) d'Or · ${h.enfants} enfant(s)</div>
          </div>
          <div class="si-cost">${h.note}/100</div>
        </div>
      </div>`).join('')
    }
    <div class="btn-stack">
      <button class="btn btn-ghost" onclick="G=null;render()">← Accueil</button>
    </div>
  </main>`;
}

/* ---------------------------- Démarrage ---------------------------- */
G = null;
appliquerTheme();
render();
</script>
