<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Légende XI — Écris ta légende</title>
<style>
:root{
  --bg:#080b10;
  --pitch-dark:#0a0d13;
  --pitch:#11151d;
  --pitch-line:#232b39;
  --paper:#0c0f15;
  --paper-white:#161b25;
  --paper-shadow:#262f40;
  --ink:#eef2f7;
  --ink-soft:#8d99ad;
  --gold:#f0b429;
  --gold-light:#ffd873;
  --red:#ff5c5c;
  --blue:#8b7bff;
  --green-ok:#3ddc84;
  --accent:#c6ff4d;
  --accent-ink:#0c1206;
  --accent2:#8b7bff;
  --radius:16px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:
    radial-gradient(1100px 600px at 50% -12%, rgba(198,255,77,0.10) 0%, transparent 60%),
    radial-gradient(900px 500px at 90% 10%, rgba(139,123,255,0.08) 0%, transparent 55%),
    var(--bg);
  color:var(--ink);
  font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  min-height:100vh;
  display:flex;
  justify-content:center;
  padding:0;
}
#app{
  width:100%;
  max-width:560px;
  min-height:100vh;
  background:var(--paper);
  box-shadow:0 0 80px rgba(0,0,0,0.6);
  position:relative;
  display:flex;
  flex-direction:column;
}
::selection{background:var(--accent);color:var(--accent-ink);}

/* ---------- Typography helpers ---------- */
.display{
  font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
  text-transform:uppercase;
  letter-spacing:-0.02em;
  font-weight:800;
}
.eyebrow{
  font-family: system-ui, -apple-system, sans-serif;
  text-transform:uppercase;
  font-size:11px;
  letter-spacing:0.14em;
  font-weight:700;
  color:var(--ink-soft);
}
.ui-font{ font-family: system-ui, -apple-system, sans-serif; }
.flag{font-size:1.05em;margin-right:5px;filter:drop-shadow(0 1px 1px rgba(0,0,0,0.3));}

/* ---------- Header / masthead ---------- */
.masthead{
  background:linear-gradient(180deg,var(--pitch-dark),var(--pitch));
  color:var(--ink);
  padding:14px 18px 10px;
  border-bottom:1px solid var(--pitch-line);
  box-shadow:0 1px 0 rgba(198,255,77,0.12);
  position:sticky;
  top:0;
  z-index:20;
}
.masthead-row{display:flex;align-items:center;justify-content:space-between;}
.masthead-title{
  font-size:21px;
  letter-spacing:-0.03em;
}
.masthead-title span{color:var(--accent);}
.masthead-sub{
  font-family: system-ui, sans-serif;
  font-size:10.5px;
  letter-spacing:0.08em;
  color:var(--ink-soft);
  text-transform:uppercase;
}
.jetons-pill{
  font-family: system-ui, sans-serif;
  font-size:12.5px;
  font-weight:800;
  background:rgba(240,180,41,0.14);
  border:1px solid rgba(240,180,41,0.5);
  color:var(--gold-light);
  padding:5px 11px;
  border-radius:999px;
  white-space:nowrap;
}
.theme-toggle{
  width:30px;height:30px;border-radius:50%;
  background:var(--paper-white);border:1px solid var(--paper-shadow);
  font-size:14px;line-height:1;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  padding:0;flex-shrink:0;
}
.theme-toggle:active{transform:scale(0.94);}

/* ---------- Ticker d'actualités (accueil) ---------- */
.ticker-bar{
  background:var(--pitch);border-bottom:1px solid var(--pitch-line);
  overflow:hidden;white-space:nowrap;padding:7px 0;
}
.ticker-bar span{
  display:inline-block;padding-left:100%;
  font-family:system-ui,sans-serif;font-size:11.5px;color:var(--ink-soft);
  animation:ticker-scroll 18s linear infinite;
}
@keyframes ticker-scroll{
  0%{ transform:translateX(0); }
  100%{ transform:translateX(-100%); }
}

/* ---------- Status bar (in-run) ---------- */
.statbar{
  display:flex;
  gap:10px;
  padding:10px 16px;
  background:var(--pitch);
  border-bottom:1px solid var(--pitch-line);
  overflow-x:auto;
}
.stat-chip{
  font-family: system-ui, sans-serif;
  font-size:10.5px;
  color:var(--ink-soft);
  white-space:nowrap;
  display:flex;
  align-items:center;
  gap:5px;
}
.stat-chip b{color:var(--ink);font-size:12px;}
.bar-mini{
  width:34px;height:5px;border-radius:3px;background:rgba(255,255,255,0.1);overflow:hidden;
  display:inline-block;
}
.bar-mini i{display:block;height:100%;background:var(--accent);}

/* ---------- Main content ---------- */
main{flex:1;padding:18px 18px 100px;}
h1.page-title{
  font-size:26px;
  font-weight:800;
  letter-spacing:-0.02em;
  margin:2px 0 4px;
}
p.lede{
  color:var(--ink-soft);
  font-size:14px;
  line-height:1.5;
  margin:0 0 18px;
}

/* ---------- Buttons ---------- */
.btn{
  font-family: system-ui, sans-serif;
  font-weight:700;
  font-size:14.5px;
  border:none;
  border-radius:12px;
  padding:14px 18px;
  cursor:pointer;
  width:100%;
  text-align:center;
  transition:transform .08s ease, filter .12s ease;
  letter-spacing:0.01em;
}
.btn:active{transform:scale(0.98);}
.btn-primary{background:var(--accent);color:var(--accent-ink);box-shadow:0 4px 16px rgba(198,255,77,0.22);}
.btn-primary:hover{filter:brightness(1.06);}
.btn-gold{background:linear-gradient(135deg,var(--gold-light),var(--gold));color:#2c2107;box-shadow:0 4px 16px rgba(240,180,41,0.25);}
.btn-ghost{background:transparent;color:var(--ink);border:1.5px solid var(--pitch-line);box-shadow:none;}
.btn-ghost:hover{border-color:var(--accent);}
.btn-red{background:var(--red);color:#2b0b0b;box-shadow:0 4px 16px rgba(255,92,92,0.22);}
.btn-violet{background:var(--accent2);color:#0d0620;box-shadow:0 4px 16px rgba(139,123,255,0.25);}
.btn-stack{display:flex;flex-direction:column;gap:10px;margin-top:14px;}
.btn-row{display:flex;gap:10px;}
.btn-row .btn{flex:1;}
.btn[disabled]{opacity:0.35;cursor:not-allowed;}

/* ---------- Choice cards (creation & events) ---------- */
.choice-grid{display:flex;flex-direction:column;gap:8px;margin-bottom:8px;}
.choice-card{
  background:var(--paper-white);
  border:1.5px solid var(--paper-shadow);
  border-radius:var(--radius);
  padding:13px 15px;
  cursor:pointer;
  text-align:left;
  transition:border-color .12s, background .12s, transform .08s;
}
.choice-card:hover{border-color:var(--accent);}
.choice-card:active{transform:scale(0.99);}
.choice-card.selected{border-color:var(--accent);background:rgba(198,255,77,0.08);box-shadow:0 0 0 1px var(--accent) inset;}
.choice-card .cc-title{font-weight:700;font-size:15px;font-family: system-ui, sans-serif;color:var(--ink);}
.choice-card .cc-desc{font-size:12.5px;color:var(--ink-soft);margin-top:3px;line-height:1.4;}
.choice-card .cc-tag{
  display:inline-block;font-family:system-ui,sans-serif;font-size:9.5px;font-weight:700;
  text-transform:uppercase;letter-spacing:0.08em;color:var(--gold-light);margin-top:6px;
}

/* ---------- Stepper dots ---------- */
.steps-dots{display:flex;gap:5px;margin-bottom:14px;}
.steps-dots i{flex:1;height:4px;border-radius:2px;background:var(--paper-shadow);}
.steps-dots i.done{background:var(--accent);}

/* ---------- Football pitch position picker ---------- */
.pitch-wrap{
  background:radial-gradient(120% 100% at 50% 0%, #163a26 0%, #0e2417 70%);
  border:1.5px solid var(--paper-shadow);
  border-radius:var(--radius);
  padding:14px;
  margin-bottom:14px;
  position:relative;
}
.pitch-svg{width:100%;height:auto;display:block;}
.pitch-marker{cursor:pointer;}
.pitch-marker circle{fill:rgba(255,255,255,0.12);stroke:rgba(255,255,255,0.55);stroke-width:1.5;transition:fill .12s, stroke .12s;}
.pitch-marker:hover circle{stroke:var(--accent);}
.pitch-marker.selected circle{fill:var(--accent);stroke:var(--accent);}
.pitch-marker text{fill:#fff;font-size:8px;font-family:system-ui,sans-serif;font-weight:800;text-anchor:middle;dominant-baseline:middle;pointer-events:none;}
.pitch-marker.selected text{fill:var(--accent-ink);}
.pitch-caption{text-align:center;font-family:system-ui,sans-serif;font-size:13px;font-weight:700;color:var(--ink);margin-top:10px;}
.pitch-caption span{color:var(--accent);}

/* ---------- Event card (in-season) ---------- */
.event-card{
  background:var(--paper-white);
  border:1px solid var(--paper-shadow);
  border-radius:var(--radius);
  padding:18px 16px;
  margin-bottom:14px;
}
.event-kicker{
  font-family: system-ui, sans-serif;font-size:10px;font-weight:800;letter-spacing:0.1em;
  text-transform:uppercase;color:var(--accent);margin-bottom:5px;
}
.event-title{font-size:20px;line-height:1.15;margin:0 0 8px;font-weight:800;letter-spacing:-0.01em;color:var(--ink);}
.event-text{font-size:14.5px;line-height:1.55;color:var(--ink-soft);}
.outcome-box{
  margin-top:12px;padding:12px 14px;border-radius:12px;background:rgba(255,255,255,0.03);
  border-left:3px solid var(--accent);font-size:13.5px;line-height:1.5;color:var(--ink);
}
.outcome-box.bad{border-left-color:var(--red);background:rgba(255,92,92,0.07);}
.outcome-box.good{border-left-color:var(--green-ok);background:rgba(61,220,132,0.07);}
.delta-row{font-family:system-ui,sans-serif;font-size:11.5px;margin-top:8px;color:var(--ink-soft);}
.delta-row span{display:inline-block;margin-right:8px;font-weight:700;}
.delta-row span.pos{color:var(--green-ok);}
.delta-row span.neg{color:var(--red);}

/* ---------- Newspaper clipping (season summary / retirement) — signature contrast element ---------- */
.clipping{
  --ink:#201a10;
  --ink-soft:#5b5240;
  background:#f2ead4;
  border-radius:14px;
  padding:20px 18px 22px;
  position:relative;
  box-shadow:0 10px 30px rgba(0,0,0,0.35);
  font-family: Georgia, 'Times New Roman', serif;
  color:var(--ink);
}
.clip-masthead{
  text-align:center;border-bottom:3px double var(--ink);padding-bottom:8px;margin-bottom:12px;
}
.clip-masthead .name{font-size:15px;letter-spacing:0.1em;}
.clip-masthead .date{font-family:system-ui,sans-serif;font-size:10px;color:var(--ink-soft);letter-spacing:0.06em;text-transform:uppercase;margin-top:2px;}
.clip-headline{font-size:26px;line-height:1.08;margin:0 0 6px;}
.clip-standfirst{font-style:italic;color:var(--ink-soft);font-size:14px;margin-bottom:12px;line-height:1.4;}
.clip-columns{columns:1;font-size:13.5px;line-height:1.6;}
.stat-table{width:100%;border-collapse:collapse;margin:14px 0;font-family:system-ui,sans-serif;font-size:12.5px;}
.stat-table td{padding:6px 4px;border-bottom:1px solid #d8cca5;}
.stat-table td:last-child{text-align:right;font-weight:700;}
.brief-box{margin-top:14px;padding-top:10px;border-top:1px dashed #d8cca5;font-size:12px;font-style:italic;color:var(--ink-soft);}
.badge-toast{
  margin-top:12px;padding:9px 12px;background:#fdf3d9;border:1px solid var(--gold);border-radius:8px;
  font-family:system-ui,sans-serif;font-size:12.5px;font-weight:700;color:#6b501a;
}

/* ---------- Home ---------- */
.hero{
  text-align:center;padding:30px 6px 8px;
}
.hero .display{font-size:36px;line-height:1.05;color:var(--ink);}
.hero .display span{color:var(--accent);}
.hero-sub{font-family:system-ui,sans-serif;font-size:12.5px;letter-spacing:0.06em;color:var(--ink-soft);margin-top:8px;}
.ball-divider{text-align:center;margin:18px 0;color:var(--pitch-line);font-size:16px;letter-spacing:10px;}

/* ---------- Grids: badges / shop ---------- */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.badge-tile{
  background:var(--paper-white);border:1.5px solid var(--paper-shadow);border-radius:14px;
  padding:12px 10px;text-align:center;
}
.badge-tile.locked{opacity:0.4;}
.badge-tile .b-icon{font-size:26px;}
.badge-tile .b-name{font-family:system-ui,sans-serif;font-weight:700;font-size:11.5px;margin-top:4px;color:var(--ink);}
.badge-tile .b-desc{font-size:10.5px;color:var(--ink-soft);margin-top:2px;line-height:1.3;}

.shop-item{
  background:var(--paper-white);border:1.5px solid var(--paper-shadow);border-radius:14px;
  padding:14px 15px;margin-bottom:10px;
}
.shop-item-top{display:flex;justify-content:space-between;align-items:center;gap:10px;}
.shop-item .si-name{font-family:system-ui,sans-serif;font-weight:800;font-size:14px;color:var(--ink);}
.shop-item .si-desc{font-size:12.5px;color:var(--ink-soft);margin-top:3px;line-height:1.4;}
.si-cost{font-family:system-ui,sans-serif;font-weight:800;font-size:13px;color:var(--gold-light);white-space:nowrap;}
.si-btn{
  font-family:system-ui,sans-serif;font-size:12px;font-weight:700;padding:8px 12px;border-radius:9px;border:none;cursor:pointer;margin-top:9px;
}
.si-owned{background:rgba(61,220,132,0.12);color:var(--green-ok);}
.si-buy{background:var(--accent);color:var(--accent-ink);}
.si-equip{background:var(--gold);color:#2c2107;}
.si-buy[disabled]{background:var(--paper-shadow);color:var(--ink-soft);cursor:not-allowed;}

/* ---------- Transfer market cards ---------- */
.transfer-card{
  background:var(--paper-white);border:1.5px solid var(--paper-shadow);border-radius:14px;
  padding:15px;margin-bottom:12px;
}
.transfer-card.current{border-color:var(--accent2);background:rgba(139,123,255,0.06);}
.transfer-card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:8px;}
.tc-club{font-family:system-ui,sans-serif;font-weight:800;font-size:15px;color:var(--ink);}
.tc-tier{font-family:system-ui,sans-serif;font-size:11px;color:var(--ink-soft);margin-top:2px;}
.tc-badge{font-family:system-ui,sans-serif;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:0.06em;background:rgba(139,123,255,0.16);color:var(--accent2);padding:4px 8px;border-radius:999px;white-space:nowrap;}
.contract-terms{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0 12px;font-family:system-ui,sans-serif;}
.term{background:rgba(255,255,255,0.03);border-radius:9px;padding:8px 10px;}
.term .t-label{font-size:9.5px;text-transform:uppercase;letter-spacing:0.06em;color:var(--ink-soft);}
.term .t-value{font-size:14px;font-weight:800;color:var(--ink);margin-top:2px;}

/* ---------- Investment cards ---------- */
.invest-card{
  background:var(--paper-white);border:1.5px solid var(--paper-shadow);border-radius:14px;
  padding:14px 15px;margin-bottom:10px;
}
.invest-row{display:flex;justify-content:space-between;align-items:center;font-family:system-ui,sans-serif;}
.invest-row .ir-name{font-weight:800;font-size:14px;color:var(--ink);}
.invest-row .ir-sub{font-size:11.5px;color:var(--ink-soft);margin-top:2px;}
.invest-row .ir-value{font-weight:800;font-size:14px;text-align:right;}
.invest-row .ir-value.pos{color:var(--green-ok);}
.invest-row .ir-value.neg{color:var(--red);}
.patrimoine-total{
  text-align:center;padding:18px 10px;margin-bottom:16px;background:linear-gradient(135deg,rgba(198,255,77,0.1),rgba(139,123,255,0.08));
  border:1px solid var(--paper-shadow);border-radius:16px;
}
.patrimoine-total .pt-label{font-family:system-ui,sans-serif;font-size:11px;text-transform:uppercase;letter-spacing:0.1em;color:var(--ink-soft);}
.patrimoine-total .pt-value{font-size:34px;font-weight:800;letter-spacing:-0.02em;color:var(--ink);margin-top:4px;}

/* ---------- Inputs ---------- */
input[type=text]{
  width:100%;padding:13px 14px;border-radius:12px;border:1.5px solid var(--paper-shadow);
  font-family:system-ui,sans-serif;font-size:15px;background:var(--paper-white);color:var(--ink);
}
input[type=text]:focus{outline:2px solid var(--accent);border-color:var(--accent);}
label.field-label{font-family:system-ui,sans-serif;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:var(--ink-soft);display:block;margin-bottom:6px;}

/* ---------- Vie privée mini panel ---------- */
.vie-panel{
  background:var(--paper-white);border:1px solid var(--paper-shadow);border-radius:12px;
  padding:11px 13px;margin-bottom:14px;font-family:system-ui,sans-serif;font-size:12.5px;color:var(--ink-soft);
  display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;
}
.vie-panel b{color:var(--ink);}

/* ---------- Bottom nav (home) ---------- */
.home-nav{display:flex;gap:8px;padding:0 16px 20px;}
.home-nav .btn{font-size:12px;padding:12px 8px;}

footer.small-note{
  text-align:center;font-family:system-ui,sans-serif;font-size:10.5px;color:var(--ink-soft);
  padding:10px 20px 26px;
}
.section-title{
  font-family:system-ui,sans-serif;font-size:11px;font-weight:800;letter-spacing:0.1em;text-transform:uppercase;
  color:var(--ink-soft);margin:22px 0 10px;
}
.tag-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;}
.pill{
  font-family:system-ui,sans-serif;font-size:11px;font-weight:700;padding:5px 11px;border-radius:999px;
  background:var(--paper-white);border:1px solid var(--paper-shadow);color:var(--ink-soft);
}
.center-note{text-align:center;color:var(--ink-soft);font-family:system-ui,sans-serif;font-size:13px;padding:30px 10px;}

/* ---------- Photo tiles (biens, animaux, enfants) ---------- */
.listing-card{
  background:var(--paper-white);border:1.5px solid var(--paper-shadow);border-radius:16px;
  overflow:hidden;margin-bottom:12px;
}
.listing-photo{
  height:92px;display:flex;align-items:center;justify-content:center;font-size:44px;
  background:linear-gradient(135deg, rgba(198,255,77,0.14), rgba(139,123,255,0.12));
}
.listing-body{padding:12px 14px;}
.listing-top{display:flex;justify-content:space-between;align-items:center;gap:8px;}
.listing-name{font-family:system-ui,sans-serif;font-weight:800;font-size:14px;color:var(--ink);}
.listing-sub{font-family:system-ui,sans-serif;font-size:11.5px;color:var(--ink-soft);margin-top:2px;}
.listing-price{font-family:system-ui,sans-serif;font-weight:800;font-size:13px;color:var(--gold-light);white-space:nowrap;}

.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px;}
.photo-tile{
  background:var(--paper-white);border:1.5px solid var(--paper-shadow);border-radius:14px;
  padding:12px 6px;text-align:center;
}
.photo-tile .pt-face{
  width:52px;height:52px;border-radius:50%;margin:0 auto 6px;display:flex;align-items:center;justify-content:center;
  font-size:26px;background:linear-gradient(135deg, rgba(198,255,77,0.18), rgba(139,123,255,0.16));
}
.photo-tile .pt-name{font-family:system-ui,sans-serif;font-weight:700;font-size:12px;color:var(--ink);}
.photo-tile .pt-sub{font-family:system-ui,sans-serif;font-size:10.5px;color:var(--ink-soft);margin-top:1px;}

/* ---------- Carte joueur façon FIFA ---------- */
.fifa-card{
  border-radius:20px;padding:20px 18px;position:relative;overflow:hidden;
  background:linear-gradient(160deg,#3a3010,#1c1706);
  border:1px solid rgba(240,180,41,0.5);
  box-shadow:0 10px 30px rgba(0,0,0,0.4);
  margin-bottom:16px;
}
.fifa-card.tier-bronze{background:linear-gradient(160deg,#5a3a22,#2c1d10);border-color:#a9713f;}
.fifa-card.tier-silver{background:linear-gradient(160deg,#5c6470,#282c33);border-color:#b9c2cc;}
.fifa-card.tier-gold{background:linear-gradient(160deg,#7a5c12,#2c2107);border-color:var(--gold);}
.fifa-card.tier-icon{background:linear-gradient(160deg,#8b7bff,#1c1330);border-color:#c9bcff;}
.fifa-top{display:flex;justify-content:space-between;align-items:flex-start;}
.fifa-ovr{font-size:44px;font-weight:800;color:var(--paper-white);line-height:1;letter-spacing:-0.02em;}
.fifa-poste{font-family:system-ui,sans-serif;font-size:13px;font-weight:800;color:var(--gold-light);margin-top:2px;}
.fifa-flag{font-size:28px;}
.fifa-face{
  width:84px;height:84px;border-radius:50%;margin:8px auto 4px;display:flex;align-items:center;justify-content:center;
  font-size:42px;background:rgba(255,255,255,0.08);border:2px solid rgba(255,255,255,0.25);
}
.fifa-name{text-align:center;font-family:system-ui,sans-serif;font-weight:800;font-size:15px;color:var(--paper-white);text-transform:uppercase;letter-spacing:0.02em;}

function sInscrireApp(appId){
  const p = G.player;
  const app = APPS_RENCONTRE.find(a=>a.id===appId);
  if(p.statutRelation==='célibataire'){
    if(Math.random() < app.chance){
      const g = genererNomAleatoire(p.nationalite);
      p.partenaire = {prenom: g.prenom, complicite: 55};
      p.statutRelation = 'en couple';
      if(!p._premiereRelation) p._premiereRelation = true;
      p.bonheurPrive = clamp(p.bonheurPrive+6,0,100);
      p.moral = clamp(p.moral+4,0,100);
      G.rencontreMsg = {texte:`${app.icon} Un match avec ${g.prenom} sur ${app.nom} ! Le courant passe immédiatement, vous voilà en couple.`, good:true};
    } else {
      G.rencontreMsg = {texte:`${app.icon} Quelques discussions sur ${app.nom}, mais rien de concluant cette fois. Tu peux retenter ta chance.`, bad:true};
    }
  } else if(p.maitresse){
    G.rencontreMsg = {texte:"Une relation secrète suffit amplement pour l'instant.", bad:true};
  } else {
    if(Math.random() < app.chance*0.8){
      const g = genererNomAleatoire(pick(NATIONALITES).nom);
      p.maitresse = {prenom: g.prenom, complicite: 50};
      p._infidele = true;
      p._tromperieSecrete = true;
      p.bonheurPrive = clamp(p.bonheurPrive+5,0,100);
      G.rencontreMsg = {texte:`${app.icon} Un match discret avec ${g.prenom} sur ${app.nom}, loin des regards de ${p.partenaire?p.partenaire.prenom:'ton/ta partenaire'}. Une relation secrète commence.`, good:true};
    } else {
      G.rencontreMsg = {texte:`${app.icon} Quelques échanges discrets sur ${app.nom}, sans suite pour l'instant.`, bad:true};
    }
  }
  saveRun();
  render();
}

function genererClub(tier, nationalite){
  const parPays = CLUBS_REELS[nationalite] || CLUBS_REELS["France"];
  const nomsTier = parPays[tier] || parPays[Object.keys(parPays).map(Number).sort((a,b)=>Math.abs(a-tier)-Math.abs(b-tier))[0]];
  const nom = pick(nomsTier);
  return { nom, pays: nationalite, tier, id: uid() };
}

function genererMondeClubs(nationaliteJoueur){
  const monde = {};
  for(let t=1; t<=5; t++){
    monde[t] = [];
    const paysUtilises = new Set();
    for(let i=0; i<5; i++){
      const pays = Math.random()<0.45 ? nationaliteJoueur : pick(NATIONALITES).nom;
      const parPays = CLUBS_REELS[pays] || CLUBS_REELS["France"];
      const nomsTier = parPays[t] || [];
      const dejaPris = monde[t].filter(c=>c.pays===pays).map(c=>c.nom);
      const dispo = nomsTier.filter(n=>!dejaPris.includes(n));
      const club = dispo.length ? { nom:pick(dispo), pays, tier:t, id:uid() } : genererClub(t, pays);
      monde[t].push(club);
    }
  }
  return monde;
}

function calculerCarteFifa(p){
  const profil = POSTE_FIFA_PROFILS[p.poste] || POSTE_FIFA_PROFILS.MOC;
  const bonus = p.bonusAttributs || {};
  const attrs = {};
  for(const k in profil){ attrs[k] = clamp(Math.round(p.niveau*profil[k] + 14) + (bonus[k]||0), 30, 99); }
  const ovr = clamp(Math.round(p.niveau*0.85 + p.forme*0.05 + p.discipline*0.05 + p.talent*0.05) + Math.round(Object.values(bonus).reduce((a,b)=>a+b,0)/6), 30, 99);
  const tier = ovr>=85 ? 'icon' : ovr>=75 ? 'gold' : ovr>=65 ? 'silver' : 'bronze';
  return { ovr, attrs, tier };
}

/* ---------------------------- Événements spéciaux (résolution narrative) ---------------------------- */
function resoudreEvenementSpecial(cle, p, extraTexte){
  switch(cle){
    case '__DEBUT_RELATION__': {
      const g = genererNomAleatoire(p.nationalite);
      p.partenaire = {prenom: g.prenom, complicite: 55};
      p.statutRelation = 'en couple';
      if(!p._premiereRelation) p._premiereRelation = true;
      return `Le courant passe immédiatement. Te voilà en couple avec ${g.prenom}.`;
    }
    case '__FIANCAILLES__': {
      p.statutRelation = 'fiancé';
      return `${p.partenaire.prenom} dit oui, les larmes aux yeux. Vous voilà fiancés !`;
    }
    case '__MARIAGE__': {
      p.statutRelation = 'marié';
      p._fut_marie = true;
      if(p.age<28) p._marieAvant28 = true;
      p.bonheurPrive = clamp(p.bonheurPrive+15,0,100);
      return `La cérémonie avec ${p.partenaire.prenom} restera gravée à jamais. Vous êtes mariés !`;
    }
    case '__RUPTURE__': {
      const nomEx = p.partenaire ? p.partenaire.prenom : 'ton/ta partenaire';
      p.statutRelation = 'célibataire';
      p.partenaire = null;
      p._rupture = true;
      p.bonheurPrive = clamp(p.bonheurPrive-15,0,100);
      p.moral = clamp(p.moral-10,0,100);
      p._rupturePending = true;
      return `La rupture avec ${nomEx} est difficile à encaisser.`;
    }
    case '__BLESSURE__': {
      const posteRisque = {AD:1.25, AG:1.25, BU:1.2, SA:1.2, LD:1.1, LG:1.1, GB:0.6, DC:0.75}[p.poste] || 1;
      const modeRisque = {fetard:1.2, reseaux:1.15, discipline:0.8, mental:0.85}[p.modeVie] || 1;
      const multiplicateur = posteRisque * modeRisque * (p._antiBlessure ? 0.7 : 1);
      const grave = Math.random() < 0.4 * multiplicateur;
      if(grave){
        p._blesseGrave = true;
        p.forme = clamp(p.forme-35,0,100);
        p.niveau = clamp(p.niveau-6,0,100);
        p._blessureRecuperation = true;
        return `Le diagnostic tombe : blessure grave. Une longue rééducation t'attend.`;
      }else{
        p.forme = clamp(p.forme-18,0,100);
        return `Une blessure sans gravité, mais qui va te tenir éloigné des terrains quelques semaines.`;
      }
    }
    case '__SCANDALE__': {
      p._scandale = true;
      p.popularite = clamp(p.popularite-15,0,100);
      p.moral = clamp(p.moral-6,0,100);
      return `L'affaire enfle et devient un vrai scandale médiatique. Ton image en pâtit durablement.`;
    }
    case '__TROMPERIE_DECOUVERTE__': {
      p._tromperieSecrete = false;
      p._scandale = true;
      const nomEx = p.partenaire ? p.partenaire.prenom : 'ton/ta partenaire';
      p.statutRelation = 'célibataire';
      p.partenaire = null;
      p.popularite = clamp(p.popularite-18,0,100);
      p.bonheurPrive = clamp(p.bonheurPrive-20,0,100);
      p.moral = clamp(p.moral-12,0,100);
      return `L'affaire éclate au grand jour. ${nomEx} rompt immédiatement, et la presse s'empare de l'histoire.`;
    }
    default: return extraTexte || '';
  }
}

    parents: { pere: genererNomAleatoire(create.nationalite,'m').prenom, mere: genererNomAleatoire(create.nationalite,'f').prenom },
    _streakType: null,
    _streakCount: 0,
    investissements: { immobilier:0, livret:0, proprietes:[], bourse:0 },
    club: genererClub(clubDepart.tier, create.nationalite),
    carriereClubs: [],
    capitaine: false,
    statutRelation: 'célibataire',
    partenaire: null,
    enfants: [],
    animaux: [],
    badgesDebloques: [],
    journal: [],
    stats: {matchs:0, buts:0, passes:0, titres:0, coupesNationales:0, coupesContinentales:0, coupesDuMonde:0, ballonsOr:0, selections:0, cleanSheets:0, theBest:0, mondeXI:0},
    _maxTierAtteint: clubDepart.tier,
    _maxPopularite: 10,
    _saisonsCapitaine: 0,
    _aAnimal: false,
    _premiereRelation: false,
    _marieAvant28: false,
    _fut_marie: false,
    _meilleurButeur: false,
    _blesseGrave: false,
    _revenuBlessure: false,
    _releg: false,
    _aPromu: false,
    _scandale: false,
    _grosseAugmentation: false,
    _philanthrope: false,
    _reconversion: false,
    _rupture: false,
    _rebondiApresRupture: false,
    _antiBlessure: false,
    _herosGrandMatch: false,
    _burnOutVecu: false,
    _trophyKopa: false,
    _trophyYachine: false,
    _soulierOr: false,
    _retraite: false,
    _noteFinale: 0,
  };

  const hobby = HOBBIES.find(h=>h.id===create.hobby);
  [origine.delta, modeVie.delta, entourage.delta, clubDepart.delta, hobby&&hobby.delta].forEach(dl=>appliquerDelta(p, dl));

  // avantages équipés (max 2)
  (create.avantagesEquipes||[]).forEach(id=>{
    const av = AVANTAGES.find(a=>a.id===id);
    if(!av) return;
    if(av.delta) appliquerDelta(p, av.delta);
    if(av.effet==='clubTier3'){ p.club = genererClub(3, create.nationalite); p._maxTierAtteint=3; p.salaire=TIERS[3].salaireBase; }
    if(av.effet==='agentGratuit'){ p.entourage='agent'; appliquerDelta(p,{cote:20000}); }
    if(av.effet==='enCoupleDepart'){
      const g = genererNomAleatoire(create.nationalite);
      p.partenaire = {prenom:g.prenom, complicite:55}; p.statutRelation='en couple'; p._premiereRelation=true;
    }
    if(av.effet==='antiBlessure'){ p._antiBlessure = true; }
  });

  p.niveau = clamp(p.niveau,10,99);
  return p;
}

function appliquerDelta(p, delta){
  if(!delta) return;
  for(const k in delta){
    if(k==='epargne' || k==='cote' || k==='salaire'){ p[k] = Math.max(0, (p[k]||0) + delta[k]); }
    else if(k in p && typeof p[k]==='number'){ p[k] = clamp((p[k]||0) + delta[k], 0, 100); }
  }
  if(p.popularite > p._maxPopularite) p._maxPopularite = p.popularite;
}
function ajusterComplicite(personne, delta){
  if(personne){ personne.complicite = clamp((personne.complicite==null?55:personne.complicite) + delta, 0, 100); }
}

function reagirPartenaire(personne, gainComplicite){
  const base = personne.complicite==null ? 55 : personne.complicite;
  const roll = randi(0,100) + Math.round((base-50)*0.25);
  let niveau, mult;
  if(roll>=70){ niveau='enthousiaste'; mult=1.3; }
  else if(roll>=32){ niveau='positive'; mult=1; }
  else { niveau='mitigee'; mult=-0.6; }
  const gainFinal = Math.round(gainComplicite*mult);
  ajusterComplicite(personne, gainFinal);
  const citation = pick(REACTIONS_PARTENAIRE[niveau]);
  return { niveau, citation, gainFinal };
}

/* ---------------------------- Boucle de saison ---------------------------- */
function piocherEvenements(pool, usedList, n, p){
  const dispo = pool.filter(e=>e.cond(p));
  let candidats = dispo.filter(e=>!usedList.includes(e.id));
  const resultats = [];
  for(let i=0;i<n;i++){
    let choixPossibles = candidats.filter(e=>!resultats.includes(e));
    if(choixPossibles.length===0) choixPossibles = dispo.filter(e=>!resultats.includes(e));
    if(choixPossibles.length===0) break;
    resultats.push(pick(choixPossibles));
  }
  return resultats;
}
function obtenirEvenement(ref){
  if(!ref) return null;
  const pool = ref.source==='sport' ? EVENTS_SPORT : EVENTS_VIE;
  return pool.find(e=>e.id===ref.id) || null;
}
function enfantParAge(p, age){
  return (p.enfants||[]).find(e=>e.age===age);
}

function determinerGrandMatch(p){
  const chanceFinale = clamp(0.05 + (p.niveau-50)/280 + (p.club.tier<=2?0.05:0), 0.03, 0.3);
  if(Math.random() < chanceFinale) return 'finale';
  const chanceDerby = p.club.tier<=4 ? 0.55 : 0.35;
  if(Math.random() < chanceDerby) return 'derby';
  return null;
}

function demarrerSaison(){
  const p = G.player;
  G.deuilMsg = null;
  G.decouverteMaitresse = null;
  p.age++;
  p.saison++;
  // régénération / usure
  const regen = p.modeVie==='discipline' ? 10 : 6;
  p.forme = clamp(p.forme + regen, 0, 100);
  if(p.age>=31){ p.niveau = clamp(p.niveau - randi(1,3), 5, 100); }
  else if(p.age<=23){ p.niveau = clamp(p.niveau + randi(1,3), 5, 100); }

  G.usedSport = G.usedSport || [];
  G.usedVie = G.usedVie || [];
  const evsSport = piocherEvenements(EVENTS_SPORT, G.usedSport, 2, p);
  const evsVie = piocherEvenements(EVENTS_VIE, G.usedVie, 2, p);
  const seq = [];
  const maxLen = Math.max(evsSport.length, evsVie.length);
  for(let i=0;i<maxLen;i++){
    if(evsSport[i]) seq.push({source:'sport', id:evsSport[i].id});
    if(evsVie[i]) seq.push({source:'vie', id:evsVie[i].id});
  }
  G.seasonEvents = seq;
  G.usedSport = G.usedSport.concat(evsSport.map(e=>e.id));
  if(G.usedSport.length > EVENTS_SPORT.length-2) G.usedSport = [];
  G.usedVie = G.usedVie.concat(evsVie.map(e=>e.id));
  if(G.usedVie.length > EVENTS_VIE.length-2) G.usedVie = [];

  G.grandMatchType = determinerGrandMatch(p);

  G.seasonStep = 0;
  G.seasonLog = [];
  G.conferenceQuestions = [...CONFERENCE_QUESTIONS].sort(()=>Math.random()-0.5).slice(0,3);
  G.conferenceIndex = 0;
  G.screen = 'conference_presse';
  saveRun();
  render();
}

function calculerFinSaison(){
  const p = G.player;
  const posteMult = {GB:{buts:0.02,passes:0.05}, DC:{buts:0.1,passes:0.15}, LD:{buts:0.12,passes:0.35}, LG:{buts:0.12,passes:0.35}, MDC:{buts:0.2,passes:0.4}, MC:{buts:0.3,passes:0.45}, MOC:{buts:0.45,passes:0.5}, AD:{buts:0.55,passes:0.4}, AG:{buts:0.55,passes:0.4}, SA:{buts:0.65,passes:0.3}, BU:{buts:0.75,passes:0.25}}[p.poste] || {buts:0.3,passes:0.35};
  const perf = (p.niveau*0.5 + p.forme*0.3 + p.moral*0.2)/100;
  const matchs = clamp(Math.round(rand(20,36) * (p.forme/100)), p._blesseGrave?4:10, 38);
  const buts = Math.round(matchs * perf * posteMult.buts * rand(0.5,1.3));
  const passes = Math.round(matchs * perf * posteMult.passes * rand(0.5,1.3));
  const noteMoy = clamp(4.6 + perf*4.6 + rand(-0.35,0.35), 3, 9.6);
  const cleanSheets = (p.poste==='GB'||p.poste==='DC') ? Math.round(matchs*perf*0.35) : 0;

  p.stats.matchs += matchs;
  p.stats.buts += buts;
  p.stats.passes += passes;
  p.stats.cleanSheets += cleanSheets;

  // classement club
  const tierInfo = TIERS[p.club.tier];
  const ambitionRank = {5:14,4:10,3:8,2:4,1:1}[p.club.tier];
  const classement = clamp(Math.round(ambitionRank + rand(-4,4) - (perf-0.5)*6), 1, 18);
  const objectifReussi = classement <= ambitionRank;
  let titreGagne = false, coupeContinentale=false, releg=false, promu=false;
  if(p.club.tier<=2 && classement===1 && Math.random()<0.5){ titreGagne=true; p.stats.titres++; }
  if(p.club.tier===1 && Math.random()<0.12){ coupeContinentale=true; p.stats.coupesContinentales++; }
  if(!objectifReussi && classement>=15 && Math.random()<0.4 && p.club.tier<5){ releg=true; p.club.tier=clamp(p.club.tier+1,1,5); p._releg=true; }
  if(objectifReussi && classement<=3 && Math.random()<0.3 && p.club.tier>1){ promu=true; p.club.tier=clamp(p.club.tier-1,1,5); p._aPromu=true; }

  // sélection nationale
  let selection = false;
  if(p.niveau>=68 && p.popularite>=40 && Math.random()<0.3){ selection=true; p.stats.selections += randi(1,6); }
  let coupeDuMonde=false;
  if(selection && p.niveau>=85 && Math.random()<0.08){ coupeDuMonde=true; p.stats.coupesDuMonde++; }

  // meilleur buteur (flavor)
  if(buts>=18 && Math.random()<0.35){ p._meilleurButeur = true; }

  // ---- Coupe nationale ----
  let coupeNationale = false;
  const chanceCoupe = clamp(0.04 + (p.niveau-50)/280, 0.02, 0.2);
  if(Math.random() < chanceCoupe){ coupeNationale = true; p.stats.coupesNationales++; }

  // ---- Points de compétence : calculés plus bas, une fois toutes les récompenses connues ----

  // ---- Fatigue mentale ----
  const variationFatigue = (matchs>=32 ? 8 : 4) + (p.popularite>=60?4:0) - (p.modeVie==='mental'?6:0) - 10;
  p.fatigueMentale = clamp((p.fatigueMentale||20) + variationFatigue, 0, 100);
  let burnOut = false;
  if(p.fatigueMentale>=85 && Math.random()<0.35){
    burnOut = true;
    p._burnOutVecu = true;
    p.forme = clamp(p.forme-15,0,100);
    p.moral = clamp(p.moral-10,0,100);
    p.fatigueMentale = clamp(p.fatigueMentale-25,0,100);
  }

  // ---- Série de forme ----
  if(noteMoy>=7.3){ p._streakType = p._streakType==='pointe' ? 'pointe' : 'pointe'; p._streakCount = p._streakType==='pointe' ? (p._streakCount||0)+1 : 1; }
  else if(noteMoy<=5.2){ p._streakType = 'meforme'; p._streakCount = (p._streakCount||0)+1; }
  else { p._streakType = null; p._streakCount = 0; }
  let streakTexte = null;
  if(p._streakType==='pointe' && p._streakCount>=2){ streakTexte = `En pleine bourre depuis ${p._streakCount} saisons !`; p.moral = clamp(p.moral+5,0,100); }
  if(p._streakType==='meforme' && p._streakCount>=2){ streakTexte = `Une méforme qui dure depuis ${p._streakCount} saisons...`; p.moral = clamp(p.moral-5,0,100); }

  // ---- Confiance du président ----
  let deltaPresident = objectifReussi ? 6 : -8;
  if(titreGagne) deltaPresident += 10;
  if(coupeNationale) deltaPresident += 5;
  p.confiancePresident = clamp((p.confiancePresident==null?50:p.confiancePresident) + deltaPresident, 0, 100);

  // ---- Classement mondial individuel & récompenses ----
  const scoreJoueur = p.niveau*0.35 + Math.min(40, buts*1.1) + (titreGagne?12:0) + (coupeContinentale?8:0) + (coupeDuMonde?18:0) + p.popularite*0.15 + noteMoy*3;
  const eligible = p.niveau>=55;
  const rivaux = Array.from({length:29}, ()=> rand(58,98));
  const rangBrut = rivaux.filter(s=>s>scoreJoueur).length + 1;
  const classementMondial = eligible && rangBrut<=30 ? rangBrut : null;

  let ballonOr=false, theBest=false, worldXI=false, trophyKopa=false, trophyYachine=false, soulierOr=false;
  if(classementMondial===1){ ballonOr=true; p.stats.ballonsOr++; }
  const scoreTheBest = scoreJoueur + rand(-6,6);
  const rangBestBrut = eligible ? (rivaux.map(s=>s+rand(-6,6)).filter(s=>s>scoreTheBest).length + 1) : 999;
  if(rangBestBrut===1){ theBest=true; p.stats.theBest=(p.stats.theBest||0)+1; }
  if(classementMondial && classementMondial<=11){ worldXI=true; p.stats.mondeXI=(p.stats.mondeXI||0)+1; }
  if(p.age<=21 && classementMondial && classementMondial<=15){ trophyKopa=true; p._trophyKopa=true; }
  if(p.poste==='GB' && cleanSheets>=14 && classementMondial && classementMondial<=20){ trophyYachine=true; p._trophyYachine=true; }
  if(buts>=24 && Math.random()<0.5){ soulierOr=true; p._soulierOr=true; }

  const podiumMondial = [];
  if(classementMondial){
    for(let rang=1; rang<=3; rang++){
      if(rang===classementMondial){ podiumMondial.push({rang, nom:`${p.prenom} ${p.nom}`, toi:true}); }
      else { const nat = pick(NATIONALITES).nom; const g = genererNomAleatoire(nat); podiumMondial.push({rang, nom:`${g.prenom} ${g.nom}`, pays:nat, toi:false}); }
    }
  }

  // ---- Points de compétence (arbre de progression) — les bonnes saisons rapportent beaucoup plus ----
  let pointsGagnes = Math.round(noteMoy); // base : une bonne note (7-9,6) rapporte déjà 7 à 10 points
  if(objectifReussi) pointsGagnes += 2;
  if(promu) pointsGagnes += 3;
  if(titreGagne) pointsGagnes += 5;
  if(coupeNationale) pointsGagnes += 3;
  if(coupeContinentale) pointsGagnes += 6;
  if(coupeDuMonde) pointsGagnes += 10;
  if(buts>=20) pointsGagnes += 3;
  if(classementMondial && classementMondial<=10) pointsGagnes += 5;
  if(worldXI) pointsGagnes += 3;
  if(theBest) pointsGagnes += 6;
  if(ballonOr) pointsGagnes += 8;
  pointsGagnes = Math.max(1, pointsGagnes);
  p.pointsCompetence = (p.pointsCompetence||0) + pointsGagnes;

  // évolution cote / salaire
  const ageFactor = p.age<=29 ? 1.08 : (p.age<=33 ? 0.98 : 0.85);
  p.cote = Math.max(2000, Math.round(p.cote * ageFactor * (1 + (noteMoy-6)/20)));
  const salaireEvolution = 1 + clamp((noteMoy-6)/12, -0.08, 0.18);
  p.salaire = Math.max(TIERS[p.club.tier].salaireBase*0.6, Math.round(p.salaire * salaireEvolution));
  if(salaireEvolution>=1.7) p._grosseAugmentation = true;
  p.epargne += Math.round(p.salaire*0.55);

  if(ballonOr){ p.popularite = clamp(p.popularite+15,0,100); p.cote = Math.round(p.cote*1.4); }
  else if(theBest){ p.popularite = clamp(p.popularite+10,0,100); p.cote = Math.round(p.cote*1.2); }
  else if(worldXI){ p.popularite = clamp(p.popularite+5,0,100); }

  // revenus passifs du patrimoine
  const revenuImmobilier = Math.round(p.investissements.immobilier * 0.055);
  const revenuLivret = Math.round(p.investissements.livret * 0.025);
  p.epargne += revenuImmobilier + revenuLivret;

  // indices boursiers (évoluent chaque saison, indépendamment d'un investissement ou non)
  G.indicesBourse = G.indicesBourse || { tech:100, energie:100, sante:100, sport:100 };
  const indicesPrecedents = { ...G.indicesBourse };
  Object.keys(G.indicesBourse).forEach(k=>{ G.indicesBourse[k] = Math.max(10, Math.round(G.indicesBourse[k] * (1 + rand(-0.09, 0.11)) * 10)/10); });
  let revenuBourse = 0;
  if(p.investissements.bourse>0){
    const moyenneActuelle = Object.values(G.indicesBourse).reduce((a,b)=>a+b,0)/4;
    const refPrecedente = p.investissements._bourseRef || moyenneActuelle;
    const variationPct = (moyenneActuelle - refPrecedente) / refPrecedente;
    const ancienMontant = p.investissements.bourse;
    p.investissements.bourse = Math.max(0, Math.round(p.investissements.bourse * (1+variationPct)));
    revenuBourse = p.investissements.bourse - ancienMontant;
    p.investissements._bourseRef = moyenneActuelle;
  }

  // évolution de la fondation caritative et du business parallèle
  if(p._fondation){
    p._fondation.valeur = Math.round(p._fondation.valeur * (1 + rand(0.03, 0.12)));
    p._fondation.beneficiaires = (p._fondation.beneficiaires||0) + randi(50, 400);
  }
  if(p._business){
    if(Math.random()<0.08){ p._business.faillite = true; p._business.valeur = 0; }
    else if(!p._business.faillite){ p._business.valeur = Math.max(0, Math.round(p._business.valeur * (1 + rand(-0.15, 0.28)))); }
  }

  if(p.capitaine) p._saisonsCapitaine++;

  // record blessure -> recovery
  if(p._blessureRecuperation){ p._revenuBlessure = true; p._blessureRecuperation=false; }

  // vieillissement enfants
  p.enfants.forEach(e=>e.age++);

  // vieillissement et mortalité des animaux
  p.animaux = p.animaux || [];
  p.animaux.forEach(a=>{ a.age = (a.age==null?0:a.age)+1; });
  let animalDecede = null;
  p.animaux.forEach(a=>{
    if(animalDecede) return; // un seul deuil traité par saison
    const esp = ESPECES_ANIMAUX.find(x=>x.id===a.espece);
    const esperance = esp ? esp.esperanceVie : 14;
    if(a.age >= esperance*0.6){
      const risque = clamp((a.age - esperance*0.6) / (esperance*0.7), 0, 0.85);
      if(Math.random() < risque) animalDecede = a;
    }
  });
  if(animalDecede){
    p.animaux = p.animaux.filter(a=>a!==animalDecede);
    G.animalDecede = animalDecede;
  }

  // risque de découverte de la relation secrète (maîtresse)
  if(p.maitresse && Math.random() < 0.12){
    const nomMaitresse = p.maitresse.prenom;
    const nomPartenaire = p.partenaire ? p.partenaire.prenom : null;
    p.maitresse = null;
    p._tromperieSecrete = false;
    p._scandale = true;
    G.decouverteMaitresse = nomPartenaire
      ? `L'affaire avec ${nomMaitresse} éclate au grand jour. ${nomPartenaire} rompt immédiatement, et la presse s'empare de l'histoire.`
      : `Ta relation secrète avec ${nomMaitresse} s'ébruite publiquement, sans que cela ne remette en cause ta situation actuelle.`;
    if(p.statutRelation==='marié' || p.statutRelation==='fiancé' || p.statutRelation==='en couple'){
      p.statutRelation = 'célibataire';
      p.partenaire = null;
    }
    p.popularite = clamp(p.popularite-18,0,100);
    p.bonheurPrive = clamp(p.bonheurPrive-20,0,100);
    p.moral = clamp(p.moral-12,0,100);
  }

  if(p._rupturePending){ if(Math.random()<0.5) p._rebondiApresRupture = true; p._rupturePending=false; }

  const breve = pick(BREVES);
  const headline = genererManchette(p, {classement, objectifReussi, titreGagne, buts, noteMoy});

  p.journal = p.journal || [];
  p.journal.push({ saison: p.saison-1, age: p.age, club: p.club.nom, headline, matchs, buts, passes, noteMoy: noteMoy.toFixed(1) });

  const recap = {
    saison: p.saison-1, age: p.age, club: p.club.nom, tier: p.club.tier,
    matchs, buts, passes, noteMoy: noteMoy.toFixed(1), classement, objectifLabel: tierInfo.ambitionLabel,
    objectifReussi, titreGagne, coupeNationale, coupeContinentale, releg, promu, selection, coupeDuMonde,
    salaire: p.salaire, cote: p.cote, breve, headline, revenuPatrimoine: revenuImmobilier+revenuLivret+revenuBourse,
    classementMondial, podiumMondial, ballonOr, theBest, worldXI, trophyKopa, trophyYachine, soulierOr,
    pointsGagnes, fatigueMentale: p.fatigueMentale, burnOut, streakTexte, confiancePresident: p.confiancePresident,
  };
  G.dernierRecap = recap;

  // badges
  const nouveaux = [];
  BADGES.forEach(b=>{
    if(!p.badgesDebloques.includes(b.id) && b.check(G)){
      p.badgesDebloques.push(b.id);
      nouveaux.push(b);
      if(!BANK.badgesGlobal.includes(b.id)) BANK.badgesGlobal.push(b.id);
    }
  });
  G.dernierRecap.nouveauxBadges = nouveaux;
  saveBank();

  G.screen = G.animalDecede ? 'deuil_animal' : 'season_summary';
  saveRun();
}

function genererManchette(p, r){
  if(r.titreGagne) return `${p.club.nom.toUpperCase()} SACRÉ CHAMPION !`;
  if(r.coupeContinentale) return `${p.prenom.toUpperCase()} ${p.nom.toUpperCase()} SUR LE TOIT DE L'EUROPE`;
  if(r.buts>=20) return `${p.prenom.toUpperCase()} ${p.nom.toUpperCase()} EN FEU : ${r.buts} BUTS CETTE SAISON`;
  if(r.classement<=3 && r.objectifReussi) return `${p.club.nom.toUpperCase()} SUR LE PODIUM`;
  if(!r.objectifReussi && r.classement>=15) return `SAISON CAUCHEMAR POUR ${p.club.nom.toUpperCase()}`;
  if(r.noteMoy>=7.5) return `${p.prenom.toUpperCase()} ${p.nom.toUpperCase()}, LA RÉVÉLATION DE LA SAISON`;
  return `${p.club.nom.toUpperCase()} : UNE SAISON SANS RELIEF`;
}

      case 'achat_voiture': html += renderAchatVoiture(); break;
      case 'conference_presse': html += renderConferencePresse(); break;
      case 'biographie': html += renderBiographie(); break;

      case 'coach_bilan': html += renderCarriereEntraineur(); break;
      case 'nommer_enfant': html += renderNommerEnfant(); break;

      case 'lieu_insolite': html += renderLieuInsolite(); break;
      case 'fifa_card': html += renderCarteFifa(); break;

function construireActualites(saveActuelle){
  const items = [];
  if(!saveActuelle || !saveActuelle.player){
    if(HOF && HOF.length) items.push(`Au Panthéon : ${HOF[0].nom} reste la plus grande légende enregistrée, avec une note de ${HOF[0].note}/100.`);
    items.push(...BREVES);
    return items;
  }
  const p = saveActuelle.player;
  const r = saveActuelle.dernierRecap;

  if(p.journal && p.journal.length){
    const derniere = p.journal[p.journal.length-1];
    items.push(`${p.club.nom} · ${derniere.headline}`);
    if(derniere.buts>=15) items.push(`⚽ ${p.prenom} ${p.nom} a inscrit ${derniere.buts} buts la saison dernière, une véritable saison canon !`);
    if(parseFloat(derniere.noteMoy)<=5.5) items.push(`📉 Saison compliquée pour ${p.prenom} ${p.nom}, avec une note moyenne de seulement ${derniere.noteMoy}/10.`);
    if(parseFloat(derniere.noteMoy)>=7.5) items.push(`✨ ${p.prenom} ${p.nom} brille avec une note moyenne de ${derniere.noteMoy}/10 la saison dernière.`);
  }
  if(r){
    if(r.titreGagne) items.push(`🏆 ${p.club.nom} a été sacré champion la saison dernière !`);
    if(r.coupeNationale) items.push(`🏆 ${p.club.nom} a remporté la coupe nationale !`);
    if(r.coupeContinentale) items.push(`🏆 ${p.club.nom} est sur le toit du continent après son sacre continental !`);
    if(r.releg) items.push(`📉 ${p.club.nom} a connu la relégation la saison passée.`);
    if(r.promu) items.push(`📈 ${p.club.nom} monte de division après une belle saison !`);
    if(r.ballonOr) items.push(`🥇 ${p.prenom} ${p.nom} a remporté le Ballon d'Or !`);
    if(r.theBest) items.push(`🌍 ${p.prenom} ${p.nom} a été élu The Best FIFA !`);
    if(r.selection) items.push(`${drapeauDe(p.nationalite)} ${p.prenom} ${p.nom} a honoré une nouvelle sélection nationale.`);
    if(r.coupeDuMonde) items.push(`🌍 ${p.prenom} ${p.nom} est champion du monde !`);
    if(r.burnOut) items.push(`😮‍💨 La pression a fini par rattraper ${p.prenom} ${p.nom}, une saison mentalement éprouvante.`);
  }
  if(p.enfants && p.enfants.length){
    const dernier = p.enfants[p.enfants.length-1];
    items.push(`👶 La famille de ${p.prenom} ${p.nom} s'est agrandie : bienvenue à ${dernier.prenom} !`);
  }
  if(p.statutRelation==='marié') items.push(`💍 ${p.prenom} ${p.nom} a dit "oui" à ${p.partenaire?p.partenaire.prenom:'son/sa partenaire'} !`);
  if(p.statutRelation==='fiancé') items.push(`💍 ${p.prenom} ${p.nom} s'est fiancé(e) avec ${p.partenaire?p.partenaire.prenom:'son/sa partenaire'} !`);
  if(p._rupture) items.push(`💔 La vie sentimentale de ${p.prenom} ${p.nom} continue de faire parler d'elle.`);
  if(p.animaux && p.animaux.length){
    const dernierAnimal = p.animaux[p.animaux.length-1];
    items.push(`🐾 ${p.prenom} ${p.nom} a accueilli un nouveau compagnon à quatre pattes : ${dernierAnimal.nom}.`);
  }
  if(p._blesseGrave) items.push(`🩹 ${p.prenom} ${p.nom} traverse une période délicate sur le plan physique.`);
  if(p._herosGrandMatch) items.push(`🌟 On ne parle que de ça : la performance héroïque de ${p.prenom} ${p.nom} en grand match !`);
  if(p.badgesDebloques && p.badgesDebloques.length){
    const dernierBadgeId = p.badgesDebloques[p.badgesDebloques.length-1];
    const badge = BADGES.find(b=>b.id===dernierBadgeId);
    if(badge) items.push(`${badge.icon} Nouveau badge débloqué par ${p.prenom} ${p.nom} : ${badge.nom} !`);
  }
  items.push(`💶 La cote de ${p.prenom} ${p.nom} est désormais estimée à ${fmtEuro(p.cote)}.`);
  if((p.fatigueMentale||0)>=70) items.push(`😮‍💨 La fatigue mentale guette ${p.prenom} ${p.nom} après une saison particulièrement intense.`);
  if(saveActuelle.rival) items.push(`⚔️ La rivalité entre ${p.prenom} ${p.nom} et ${saveActuelle.rival.prenom} ${saveActuelle.rival.nom} continue de faire parler d'elle.`);
  if(p._fondation) items.push(`🎗️ La Fondation ${p.prenom} ${p.nom} a désormais aidé plus de ${(p._fondation.beneficiaires||0).toLocaleString('fr-FR')} personnes.`);
  if(p._business && !p._business.faillite) items.push(`🏢 ${p._business.nom} continue de se développer en parallèle de la carrière de ${p.prenom} ${p.nom}.`);

  if(items.length===0) items.push(pick(BREVES));
  return items;
}

function genererOffresTransfert(p){
  const tierActuel = p.club.tier;
  const tiersPossibles = [tierActuel-1, tierActuel, tierActuel+1].filter(t=>t>=1 && t<=5);
  const nbOffres = randi(3,5);
  const offres = [];
  let tentativesTotal = 0;
  while(offres.length < nbOffres && tentativesTotal < 30){
    tentativesTotal++;
    const tier = pick(tiersPossibles);
    // 30% du même pays que le joueur, 70% d'un pays tiré au hasard : un vrai marché mondial
    const pays = Math.random()<0.3 ? p.nationalite : pick(NATIONALITES).nom;
    const poolPays = CLUBS_REELS[pays] || CLUBS_REELS["France"];
    const nomsTier = poolPays[tier];
    if(!nomsTier || !nomsTier.length) continue;
    const nom = pick(nomsTier);
    if(nom === p.club.nom) continue;
    if(offres.some(o=>o.club.nom===nom && o.club.pays===pays)) continue;
    const club = { nom, pays, tier, id: uid() };
    const tierInfo = TIERS[tier];
    const salaire = Math.round(tierInfo.salaireBase * rand(0.75,1.35) * (1 + p.niveau/140));
    const duree = randi(1,4);
    const prime = Math.round(p.cote * rand(0.04,0.22));
    offres.push({ club, salaire, duree, prime });
  }
  return offres;
}

function ouvrirMercato(returnTo){

/* ------------------------------ GRAND MATCH (DERBY / FINALE) ------------------------------ */
function demarrerGrandMatch(type){
  const template = MATCH_TEMPLATES[type];
  const introIdx = randi(0, template.intros.length-1);
  const phaseIdx = [
    randi(0, template.phasesDebut.length-1),
    randi(0, template.phasesMilieu.length-1),
    randi(0, template.phasesFin.length-1),
  ];
  G.matchState = { type, introIdx, phaseIdx, phaseIndex:-1, log:[], butsExtra:0, passesExtra:0, heros:false, stage:'intro' };
  G.screen = 'match';
  saveRun();
  render();
}
function obtenirPhaseMatch(ms, slot){
  const template = MATCH_TEMPLATES[ms.type];
  const pools = [template.phasesDebut, template.phasesMilieu, template.phasesFin];
  return pools[slot][ms.phaseIdx[slot]];
}
function lancerCoupEnvoi(){
  G.matchState.stage = 'phase';
  G.matchState.phaseIndex = 0;
  saveRun();
  render();
}
function resoudreChoixMatch(i){
  const p = G.player;
  const ms = G.matchState;
  const phase = obtenirPhaseMatch(ms, ms.phaseIndex);
  const choix = phase.choix[i];
  const res = choix.resolve(p);
  if(res.but) ms.butsExtra++;
  if(res.passe) ms.passesExtra++;
  if(res.heros) ms.heros = true;
  appliquerDelta(p, res.delta);
  ms.log.push({ minute:phase.minute, texte:res.texte, bad:res.bad, good:res.good });
  ms.lastOutcome = { texte:res.texte, delta:res.delta, bad:res.bad, good:res.good };
  ms.stage = 'phase_result';
  saveRun();
  render();
}

function continuerMatch(){
  const ms = G.matchState;
  ms.phaseIndex++;
  if(ms.phaseIndex >= ms.phaseIdx.length){
    ms.stage = (ms.butsExtra>0 && !ms.celebrationFaite) ? 'celebration' : 'recap';
  } else {
    ms.stage = 'phase';
  }
  saveRun();
  render();
}
function choisirCelebration(id){
  const p = G.player;
  const ms = G.matchState;
  const c = CELEBRATIONS.find(x=>x.id===id);
  appliquerDelta(p, c.delta);
  ms.celebrationChoisie = c.label;
  ms.celebrationFaite = true;
  ms.stage = 'recap';
  saveRun();
  render();
}
function terminerGrandMatch(){
  const p = G.player;
  const ms = G.matchState;
  p.stats.buts += ms.butsExtra;
  p.stats.passes += ms.passesExtra;
  if(ms.heros) p._herosGrandMatch = true;
  G.matchState = null;
  saveRun();
  calculerFinSaison();
  render();

  if(ms.stage==='phase'){

      </div>
    </main>`;
  }
  if(ms.stage==='phase_result'){
    const o = ms.lastOutcome;
    const cls = o.bad ? 'bad' : (o.good ? 'good' : '');
    return `<main>

  const verdict = ms.heros ? "Tu es le grand héros de ce match !" : (ms.butsExtra>0 ? "Une performance décisive de ta part." : "Un match disputé, sans éclat individuel.");

function relationProtegee(cible){
  const p = G.player;
  const personne = cible==='maitresse' ? p.maitresse : p.partenaire;
  if(cible==='maitresse'){ if(!p.maitresse){ render(); return; } }
  else if(!['en couple','fiancé','marié'].includes(p.statutRelation)){ render(); return; }
  const reaction = reagirPartenaire(personne, 8);
  p.bonheurPrive = clamp(p.bonheurPrive+(reaction.niveau==='mitigee'?2:7),0,100);
  p.moral = clamp(p.moral+(reaction.niveau==='mitigee'?1:4),0,100);
  G.familleMsg = {texte:`Un moment protégé avec ${personne.prenom}, sans aucun risque de grossesse. ${personne.prenom} : « ${reaction.citation} »`, good: reaction.niveau!=='mitigee'};
  saveRun(); render();
}

function seMarier(){
  const p = G.player;
  if(p.statutRelation!=='fiancé'){ render(); return; }
  const cout = 20000;
  if(p.epargne < cout){ G.familleMsg = {texte:`Il te faut au moins ${fmtEuro(cout)} pour organiser un mariage digne de ce nom.`, bad:true}; render(); return; }
  p.epargne -= cout;
  p.statutRelation = 'marié';
  p._fut_marie = true;
  if(p.age<28) p._marieAvant28 = true;
  p.bonheurPrive = clamp(p.bonheurPrive+15,0,100);
  p.moral = clamp(p.moral+6,0,100);
  G.familleMsg = {texte:`La cérémonie avec ${p.partenaire.prenom} restera gravée à jamais. Vous êtes mariés !`, good:true};
  saveRun(); render();
}
function divorcer(){
  const p = G.player;
  if(p.statutRelation!=='marié'){ render(); return; }
  const nomEx = p.partenaire.prenom;
  const perte = Math.round(p.epargne*0.3);
  p.statutRelation = 'célibataire';
  p.partenaire = null;
  p._rupture = true;
  p.epargne = Math.max(0, p.epargne - perte);
  p.bonheurPrive = clamp(p.bonheurPrive-15,0,100);
  p.moral = clamp(p.moral-8,0,100);
  G.familleMsg = {texte:`Le divorce avec ${nomEx} est officialisé. Une page se tourne, non sans douleur, et ${fmtEuro(perte)} partent dans la procédure.`, bad:true};
  saveRun(); render();

function ouvrirActivitesCouple(cible){
  const p = G.player;
  if(cible==='maitresse' && !p.maitresse){ render(); return; }
  G.activiteCible = cible || 'partenaire';
  G.screen = 'activites_couple';
  saveRun();
  render();
}
function retourActivitesCouple(){
  G.screen = 'famille';
  render();
}
function executerActiviteCouple(id){
  const p = G.player;
  const cible = G.activiteCible || 'partenaire';
  const personne = cible==='maitresse' ? p.maitresse : p.partenaire;
  const act = ACTIVITES_COUPLE.find(a=>a.id===id);
  if(!personne){ render(); return; }
  if(act.requiresMarie && cible!=='maitresse' && p.statutRelation!=='marié'){ G.familleMsg = {texte:"Il faut être marié(e) pour renouveler ses vœux.", bad:true}; G.screen='famille'; render(); return; }
  if(act.requiresMarie && cible==='maitresse'){ G.familleMsg = {texte:"Cette activité n'a pas de sens dans le cadre d'une relation secrète.", bad:true}; G.screen='famille'; render(); return; }
  if(p.epargne < act.cout){ G.familleMsg = {texte:"Épargne insuffisante pour cette activité.", bad:true}; G.screen='famille'; render(); return; }
  p.epargne -= act.cout;
  const deltaSansComplicite = { ...act.delta };
  const reaction = reagirPartenaire(personne, act.complicite);
  const facteur = reaction.niveau==='mitigee' ? 0.4 : (reaction.niveau==='enthousiaste' ? 1.2 : 1);
  Object.keys(deltaSansComplicite).forEach(k=>{ deltaSansComplicite[k] = Math.round(deltaSansComplicite[k]*facteur); });
  appliquerDelta(p, deltaSansComplicite);
  G.familleMsg = {texte:`${act.icon} ${act.nom} avec ${personne.prenom}. ${personne.prenom} : « ${reaction.citation} »`, good: reaction.niveau!=='mitigee'};
  G.screen = 'famille';
  saveRun();
  render();
}
function renderActivitesCouple(){
  const p = G.player;
  const cible = G.activiteCible || 'partenaire';
  const personne = cible==='maitresse' ? p.maitresse : p.partenaire;
  const activites = cible==='maitresse' ? ACTIVITES_COUPLE.filter(a=>!a.requiresMarie) : ACTIVITES_COUPLE;

function choisirRaceAdoption(race, prix){
  const p = G.player;
  if(p.epargne < prix){ G.familleMsg = {texte:"Épargne insuffisante pour cet achat.", bad:true}; G.screen='famille'; saveRun(); render(); return; }
  p.epargne -= prix;
  finaliserAdoption(G.adoptionEspece, race, prix);
}
function finaliserAdoption(espId, race, prix){
  const p = G.player;
  const esp = ESPECES_ANIMAUX.find(e=>e.id===espId);
  const nom = pick(esp.noms);
  const raceFinale = race || pick(esp.races);
  const age = prix>0 ? 0 : randi(0,3);
  p.animaux = p.animaux || [];
  p.animaux.push({espece:espId, nom, icon:esp.icon, race:raceFinale, age});
  p._aAnimal = true;
  p.bonheurPrive = clamp(p.bonheurPrive + (prix>0?9:6), 0, 100);
  p.moral = clamp(p.moral+4,0,100);
  G.familleMsg = {texte: prix>0 ? `${esp.icon} ${nom}, ${raceFinale}, rejoint la famille pour ${fmtEuro(prix)} !` : `${esp.icon} ${nom}, ${raceFinale}, rejoint la famille depuis le refuge !`, good:true};
  G.screen = 'famille';
  saveRun();
  render();
}

function ameliorerAttribut(cle){
  const p = G.player;

  p.bonusAttributs = p.bonusAttributs || {VIT:0,TIR:0,PAS:0,DRI:0,DEF:0,PHY:0};

  saveRun();
  render();

function acheterImmobilier(id, qte){
  qte = qte || 1;
  const p = G.player;
  const b = IMMOBILIER_LISTINGS.find(x=>x.id===id);
  const coutTotal = b.prix * qte;
  if(p.epargne < coutTotal){ G.patrimoineMsg = {texte:"Épargne insuffisante pour cet achat.", bad:true}; render(); return; }
  p.epargne -= coutTotal;
  p.investissements.immobilier += coutTotal;
  p.investissements.proprietes = p.investissements.proprietes || [];
  for(let i=0;i<qte;i++) p.investissements.proprietes.push(id);
  G.patrimoineMsg = {texte:`${b.icon} ${qte>1?qte+'x ':''}${b.nom} acquis pour ${fmtEuro(coutTotal)}. ${qte>1?'De nouveaux biens locatifs':'Un nouveau bien locatif'} dans ton patrimoine.`, good:true};
  saveRun(); render();
}
function acheterBien(id, qte){
  qte = qte || 1;
  const p = G.player;
  const b = BIENS_LISTINGS.find(x=>x.id===id);
  const coutTotal = b.prix * qte;
  if(p.epargne < coutTotal){ G.patrimoineMsg = {texte:"Épargne insuffisante pour cet achat.", bad:true}; render(); return; }
  p.epargne -= coutTotal;
  for(let i=0;i<qte;i++) appliquerDelta(p, b.delta);
  p._biensAchetes = p._biensAchetes || {};
  p._biensAchetes[id] = (p._biensAchetes[id]||0) + qte;
  G.patrimoineMsg = {texte:`${b.icon} ${qte>1?qte+'x ':''}${b.nom} t'appartient désormais.`, good:true};
  saveRun(); render();
}

  const p = G.player;
  const marque = VOITURES_MARQUES.find(m=>m.id===G.voitureMarque);

function investirBourse(montant){
  const p = G.player;
  if(p.epargne < montant){ G.patrimoineMsg = {texte:"Épargne insuffisante pour ce placement.", bad:true}; render(); return; }
  const moyenneActuelle = Object.values(G.indicesBourse||{tech:100,energie:100,sante:100,sport:100}).reduce((a,b)=>a+b,0)/4;
  const ancienMontant = p.investissements.bourse||0;
  const ancienneRef = p.investissements._bourseRef || moyenneActuelle;
  // moyenne pondérée du prix de référence pour l'ensemble du portefeuille
  p.investissements._bourseRef = ancienMontant>0 ? (ancienneRef*ancienMontant + moyenneActuelle*montant)/(ancienMontant+montant) : moyenneActuelle;
  p.epargne -= montant;
  p.investissements.bourse = ancienMontant + montant;
  G.patrimoineMsg = {texte:`${fmtEuro(montant)} investis en bourse, répartis sur les 4 indices suivis.`, good:true};
  saveRun(); render();
}
function vendreBourse(){
  const p = G.player;
  p.epargne += Math.round(p.investissements.bourse||0);
  G.patrimoineMsg = {texte:`Portefeuille boursier soldé pour ${fmtEuro(p.investissements.bourse||0)}.`, good:true};
  p.investissements.bourse = 0;
  p.investissements._bourseRef = null;
  saveRun(); render();
}
function investirEntreprise(montant){
  const p = G.player;
  if(p.epargne < montant){ G.patrimoineMsg = {texte:"Épargne insuffisante pour cette mise.", bad:true}; render(); return; }
  p.epargne -= montant;
  if(Math.random()<0.55){
    const gain = Math.round(montant * rand(1.4,2.3));
    p.epargne += gain;
    G.patrimoineMsg = {texte:`Pari gagnant ! Ta mise de ${fmtEuro(montant)} rapporte ${fmtEuro(gain)}.`, good:true};
  } else {
    const perte = Math.round(montant * rand(0.1,0.5));
    p.epargne += perte;
    G.patrimoineMsg = {texte:`L'entreprise peine à décoller. Tu ne récupères que ${fmtEuro(perte)} sur ta mise de ${fmtEuro(montant)}.`, bad:true};
  }
  saveRun(); render();
}
function investirEntrepriseListing(id){
  const p = G.player;
  const e = ENTREPRISES_LISTINGS.find(x=>x.id===id);
  if(p.epargne < e.montant){ G.patrimoineMsg = {texte:"Épargne insuffisante pour cet investissement.", bad:true}; render(); return; }
  p.epargne -= e.montant;
  if(Math.random() < e.chanceGain){
    const gain = Math.round(e.montant * rand(e.gainMult[0], e.gainMult[1]));
    p.epargne += gain;
    G.patrimoineMsg = {texte:`${e.icon} ${e.nom} décolle ! Ta mise de ${fmtEuro(e.montant)} rapporte ${fmtEuro(gain)}.`, good:true};
  } else {
    const perte = Math.round(e.montant * rand(e.perteMult[0], e.perteMult[1]));
    p.epargne += perte;
    G.patrimoineMsg = {texte:`${e.icon} ${e.nom} déçoit. Tu ne récupères que ${fmtEuro(perte)} sur ta mise de ${fmtEuro(e.montant)}.`, bad:true};
  }
  saveRun(); render();
}

function resoudreChoix(i){
  const p = G.player;
  const ev = obtenirEvenement(G.seasonEvents[G.seasonStep]);
  const choix = ev.choix[i];
  const res = choix.resolve(p);
  if(res.effet==='ouvrirMercato'){ ouvrirMercato('event'); return; }
  if(res.texte==='__NAISSANCE__'){ ouvrirNommerEnfant('avancer'); return; }
  let texte = res.texte;
  if(texte && texte.startsWith('__')){
    texte = resoudreEvenementSpecial(texte, p, texte);
  }
  if(res.effet==='capitaine') p.capitaine = true;
  if(res.effet==='hausseSure'){ p.salaire = Math.round(p.salaire*1.15); }
  if(res.effet==='hausseForte'){ p.salaire = Math.round(p.salaire*2); p._grosseAugmentation = true; }
  if(res.effet==='aAnimal') p._aAnimal = true;
  if(res.effet==='philanthrope') p._philanthrope = true;
  if(res.effet==='tromperie'){ p._tromperieSecrete = true; p._infidele = true; }
  appliquerDelta(p, res.delta);

  G.lastOutcome = { texte, delta: res.delta, bad: res.bad, good: res.good };
  G.screen = 'season_event_result';
  saveRun();
  renderEventResult();
}

function renderEventResult(){
  const p = G.player;
  const o = G.lastOutcome;
  const cls = o.bad ? 'bad' : (o.good ? 'good' : '');
  const deltaEntries = Object.entries(o.delta||{}).filter(([k,v])=>v!==0);
  const labelMap = {niveau:'Niveau',forme:'Forme',moral:'Moral',discipline:'Discipline',charisme:'Charisme',popularite:'Popularité',epargne:'Épargne',cote:'Cote',bonheurPrive:'Bonheur',talent:'Talent'};
  const app = document.getElementById('app');
  app.innerHTML = renderMasthead() + `<main>
    ${renderViePanel()}
    <div class="event-card">
      <div class="event-kicker">Conséquence</div>
      <div class="outcome-box ${cls}">${o.texte}
        ${deltaEntries.length? `<div class="delta-row">${deltaEntries.map(([k,v])=>`<span class="${v>0?'pos':'neg'}">${labelMap[k]||k} ${v>0?'+':''}${k==='epargne'||k==='cote'?fmtEuro(v):Math.round(v)}</span>`).join('')}</div>` : ''}

  </main>`;
  window.scrollTo(0,0);
}

  G.seasonStep++;

function prendreRetraite(){
  const p = G.player;
  p._retraite = true;
  // note finale
  const sportScore = clamp(
    (p.stats.matchs>=1 ? (p.niveau*0.35 + Math.min(100, p.stats.buts*0.12 + p.stats.passes*0.08)*0.25 + Math.min(100, (p.stats.titres*10+p.stats.ballonsOr*20+(p.stats.theBest||0)*15+(p.stats.mondeXI||0)*5+p.stats.coupesDuMonde*20+p.stats.coupesContinentales*12+p.stats.selections*0.6))*0.3 + p.popularite*0.1) : 0),
    0,100);
  const vieScore = clamp(p.bonheurPrive*0.55 + (p._fut_marie?15:0) + Math.min(15,p.enfants.length*5) + p.badgesDebloques.filter(id=>['b_coeur','b_fiance','b_marie','b_famille_nb','b_equilibre','b_resilient','b_ami_fidele','b_philanthrope'].includes(id)).length*3, 0, 100);
  const finale = Math.round(sportScore*0.68 + vieScore*0.32);
  p._noteFinale = finale;

  G.screen = 'reconversion_choix';
  saveRun();
  render();
}

  };

function coachDemarrerSaison(){
  G.coach.saisonCoach++;
  const dispo = [...COACH_EVENTS].sort(()=>Math.random()-0.5).slice(0,2);
  G.coach.decisions = dispo;
  G.coach.decisionIndex = 0;
  G.coach.log = [];
  G.screen = 'coach_decision';
  saveRun();
  render();
}
function coachResoudreDecision(i){
  const ev = G.coach.decisions[G.coach.decisionIndex];
  const choix = ev.choix[i];
  G.coach.niveauEquipe = clamp(G.coach.niveauEquipe + choix.effetNiveau, 15, 99);
  G.coach.budget = Math.max(0, G.coach.budget + choix.effetBudget);
  G.coach.log.push(choix.texte);
  G.coach.decisionIndex++;
  if(G.coach.decisionIndex >= G.coach.decisions.length){
    coachCalculerSaison();
  } else {
    saveRun();
    render();
  }
}
function coachCalculerSaison(){
  const c = G.coach;
  const classement = clamp(Math.round(12 - (c.niveauEquipe-50)/6 + rand(-3,3)), 1, 18);
  const titreGagne = classement===1 && Math.random()<0.35;
  if(titreGagne) c.titres++;
  if(classement<=6) c.victoiresSaisons++;
  c.budget += Math.round(c.niveauEquipe*1500 + (titreGagne?200000:0));
  c.dernierClassement = classement;
  c.dernierTitre = titreGagne;
  G.screen = 'coach_bilan';
  saveRun();
  render();
}
function coachPrendreRetraite(){
  G.coach = null;
  G.screen = 'retraite';
  saveRun();
  render();
}

function finaliserRetraite(){
  const p = G.player;
  const finale = p._noteFinale;
  BADGES.forEach(b=>{
    if(!p.badgesDebloques.includes(b.id) && b.check(G)){
      p.badgesDebloques.push(b.id);
      if(!BANK.badgesGlobal.includes(b.id)) BANK.badgesGlobal.push(b.id);
    }
  });

  // jetons gagnés (quêtes)
  let jetonsGagnes = 0;
  const quetes = QUETES_POOL.filter(q=>G.questes.includes(q.id));
  const questesReussies = quetes.filter(q=>q.check(p));
  questesReussies.forEach(q=>jetonsGagnes+=q.jetons);
  jetonsGagnes += Math.round(finale/2); // bonus note finale
  BANK.jetons += jetonsGagnes;
  BANK.statsGlobales = BANK.statsGlobales || { carrieres:0, matchs:0, buts:0, passes:0, titres:0, ballonsOr:0 };
  BANK.statsGlobales.carrieres++;
  BANK.statsGlobales.matchs += p.stats.matchs;
  BANK.statsGlobales.buts += p.stats.buts;
  BANK.statsGlobales.passes += p.stats.passes;
  BANK.statsGlobales.titres += p.stats.titres;
  BANK.statsGlobales.ballonsOr += p.stats.ballonsOr;
  saveBank();

  G.jetonsGagnesRun = jetonsGagnes;
  G.questesReussies = questesReussies;

  // Hall of Fame
  HOF.push({
    nom:`${p.prenom} ${p.nom}`, poste:p.poste, note:finale, club:p.club.nom, nationalite:p.nationalite,
    saisons:p.saison-1, buts:p.stats.buts, titres:p.stats.titres, ballonsOr:p.stats.ballonsOr,
    statutRelation:p.statutRelation, enfants:p.enfants.length,
  });
  HOF.sort((a,b)=>b.note-a.note);
  HOF = HOF.slice(0,12);
  saveHOF();

  clearRun();
  G.screen = 'retraite';
  render();
}
